version: '3.8'

services:
  # ─── Node.js Backend ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - FRONTEND_URL=http://localhost:3000
      - MONGODB_URI=mongodb://mongo:27017/nextalk
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=dev-access-secret-change-in-production-64-chars-long
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production-64-chars-long
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_SECRET=dev-ai-secret
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    volumes:
      - ./src:/app/src  # Dev hot-reload

  # ─── Python AI Service ────────────────────────────────
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_SECRET=dev-ai-secret
    restart: unless-stopped
    volumes:
      - ai-models:/root/.deepface  # Cache downloaded models

  # ─── MongoDB ──────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ─── MinIO (S3-compatible storage) ────────────────────
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  minio-data:
  ai-models:
